<h1>🗺️ 课程地图</h1>
<p>一共 12 关，每周解锁一关。<b>🔒 还没开放</b>的关卡，老师放好教材后就会亮起来——到时候可以先来<b>预习</b>！</p>

<div class="box box-tip">
  <span class="box-title">🧭 我们的「放手」路线</span>
  第 1–4 关：<b>老师做，我看</b>（跟着做、改数字）→ 第 5–8 关：<b>一起做</b>（我写大部分，老师给提示）→ 第 9–12 关：<b>我做，老师看</b>（自己规划、自己写、自己找 bug）
</div>
