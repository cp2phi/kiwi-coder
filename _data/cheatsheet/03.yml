# 📖 小词典：第 3 课学到的指令
icon: "🌀"
title: "重复的魔法：for 循环"
title_en: "The magic of repeating: for loops"
entries:
  - code: "for i in range(4):"
    zh: "把下面缩进的代码重复 4 次（最后要有冒号！）"
    en: "Repeat the indented lines below 4 times (don't forget the colon!)"
    example: "for i in range(4):\n    t.forward(100)\n    t.left(90)"
  - code: "    （缩进 4 个空格）"
    zh: "for 下面「属于它」的每一行都要往右缩 4 格，缩得一样多"
    en: "Every line that belongs to the for is pushed in 4 spaces, all the same"
    example: "for i in range(3):\n    print(\"hi\")   # 属于循环\nprint(\"bye\")      # 不属于，只跑一次"
  - code: "i"
    zh: "计数的变量：第一次是 0，然后 1、2、3……"
    en: "The counting variable: 0 the first time, then 1, 2, 3…"
    example: "for i in range(5):\n    print(i)   # 0 1 2 3 4"
  - code: "range(n)"
    zh: "数数 0、1、2 …… 一直到 n 之前（一共 n 个）"
    en: "Counts 0, 1, 2 … up to (but not including) n: n numbers"
    example: "range(4)  →  0, 1, 2, 3"
  - code: "range(a, b)"
    zh: "从 a 数到 b 之前"
    en: "Counts from a up to (not including) b"
    example: "range(1, 6)  →  1, 2, 3, 4, 5"
  - code: "range(a, b, step)"
    zh: "每次跳 step；step 是负数就倒着数"
    en: "Jumps by step; a negative step counts down"
    example: "range(5, 0, -1)  →  5, 4, 3, 2, 1"
  - code: "t.left(360 / sides)"
    zh: "多边形的秘密：一圈 360 度平均分给每条边"
    en: "The polygon secret: share 360 degrees between the sides"
    example: "sides = 6\nfor i in range(sides):\n    t.forward(80)\n    t.left(360 / sides)"
  - code: "t.forward(i * 2)"
    zh: "用 i 当长度，线会一次比一次长 → 螺旋"
    en: "Use i as the length and each line grows → a spiral"
    example: "for i in range(100):\n    t.forward(i * 2)\n    t.left(91)"
  - code: "for … :\n    for … :"
    zh: "循环里面再放一个循环（万花筒）：里面的全部跑完，外面才数下一次"
    en: "A loop inside a loop (kaleidoscope): the inner one finishes before the outer counts on"
    example: "for i in range(12):\n    for j in range(4):\n        t.forward(100)\n        t.left(90)\n    t.left(30)"
  - code: "i % 6"
    zh: "i 除以 6 的余数：0,1,2,3,4,5,0,1,2…（轮流拿颜色用）"
    en: "The remainder of i ÷ 6: 0,1,2,3,4,5,0,1,2… (great for cycling colours)"
    example: "t.color(colors[i % 6])"
  - code: "t.speed(0)"
    zh: "循环会画很多东西，先把速度调到最快"
    en: "Loops draw a lot — set the fastest speed first"
    example: "t.speed(0)"
