# 📖 小词典：第 5 课学到的指令
icon: "🎰"
title: "列表 + 随机抽"
title_en: "Lists + random picks"
entries:
  - code: 'fruits = ["apple", "kiwi", "pear"]'
    zh: "做一个列表：方括号，逗号隔开"
    en: "Make a list: square brackets, commas between"
    example: 'colours = ["red", "gold", "blue"]'
  - code: "fruits[0]"
    zh: "拿第 0 个（第一个！编号从 0 开始）"
    en: "Get item 0 (the first one! numbering starts at 0)"
    example: "print(fruits[0])"
  - code: "fruits[-1]"
    zh: "拿最后一个（负数从后面数）"
    en: "Get the last one (negatives count from the end)"
    example: "print(fruits[-1])"
  - code: "len(fruits)"
    zh: "列表里有几个东西"
    en: "How many things are in the list"
    example: "print(len(fruits))"
  - code: 'fruits.append("plum")'
    zh: "在最后加一个"
    en: "Add one to the end"
    example: "wishes = []\nwishes.append(\"a dog\")"
  - code: "random.choice(fruits)"
    zh: "随机抽一个（要先 import random）"
    en: "Pick one at random (needs import random)"
    example: "import random\nprint(random.choice(fruits))"
  - code: "for f in fruits:"
    zh: "把列表里的东西一个一个拿出来"
    en: "Take the items out one by one"
    example: "for colour in colours:\n    t.color(colour)\n    t.forward(100)"
  - code: "for i in range(len(fruits)):"
    zh: "用编号走一遍列表（可以打印序号）"
    en: "Go through the list by number (handy for numbering)"
    example: "for i in range(len(fruits)):\n    print(i + 1, fruits[i])"
  - code: "i % 6"
    zh: "i 除以 6 的余数（永远是 0～5）"
    en: "Remainder of i ÷ 6 (always 0–5)"
    example: "t.color(colours[i % 6])"
