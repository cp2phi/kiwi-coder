# 📖 小词典：第 10 课学到的指令
icon: "🗺️"
title: "项目策划 + 开发流程"
title_en: "Planning + the dev workflow"
entries:
  - code: "assert 条件, \"提示\""
    zh: "条件必须是 True，否则立刻报 AssertionError——这就是测试"
    en: "The condition must be True or it stops with AssertionError — that's a test"
    example: 'assert add(2, 3) == 5, "2 + 3 应该是 5"'
  - code: "def test():"
    zh: "把所有 assert 放进一个函数，程序一开始就调用它"
    en: "Put all asserts in one function and call it at the start"
    example: "def test():\n    assert SPEED > 0\ntest()"
  - code: "# TODO: ..."
    zh: "标记「还没做」的小步骤，做完就删掉"
    en: "Mark a step not done yet; delete it when done"
    example: "# TODO: 到 10 分显示「你赢了」"
  - code: "# 注释"
    zh: "写给人看的话；计划书可以全部用注释写成 .py 文件"
    en: "Notes for people; a plan can be a .py file made of comments"
    example: "# ===== 必做的 3 个功能 ====="
  - code: "👓 读代码三步"
    zh: "① 从上到下找 def（函数名 = 目录）② 找 while 主循环 ③ 找变量"
    en: "① scan for def (function names = contents) ② find the while main loop ③ find the variables"
    example: "def show():  def add():  while True:"
  - code: "🔄 五步循环"
    zh: "计划 → 写 → 测 → 修 → 发布，每圈只做一小步"
    en: "Plan → code → test → fix → ship, one small step per lap"
    example: "改 10 行 → 运行 → 读报错 → 修好 → commit"
  - code: "🚀 commit = 发布"
    zh: "在 GitHub 点 Commit changes，1 分钟后网站就更新（GitHub Pages）"
    en: "Click Commit changes on GitHub; the site updates in a minute (GitHub Pages)"
    example: "📤 存到作品墙 → Commit changes"
  - code: "📄 计划书"
    zh: "名字 / 做什么 / 必做 3 个 / 加分 2 个 / 小步骤 ≥ 5（每步 10 分钟）"
    en: "Name / what / 3 must-haves / 2 bonuses / ≥5 small steps (10 min each)"
    example: "小一点，但做完"
  - code: "list.pop(i)"
    zh: "拿掉列表第 i 个（从 0 数）并返回它；越界会 IndexError"
    en: "Remove and return item i (from 0); IndexError if out of range"
    example: "todo.pop(0)"
