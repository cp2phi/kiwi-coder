# 📖 小词典：第 10 课学到的指令
icon: "🗺️"
title: "项目策划 + 开发流程"
title_en: "Planning + the dev workflow"
entries:
  - code: "assert 条件, \"提示\""
    zh: "条件必须是 True，否则立刻报 AssertionError——这就是测试"
    en: "The condition must be True or it stops with AssertionError — that's a test"
    example: 'assert keep_inside(400) == 270, "飞出右边要拉回来"'
  - code: "def test():"
    zh: "把所有 assert 放进一个函数，程序一开始就调用它"
    en: "Put all asserts in one function and call it at the start"
    example: "def test():\n    assert use_fuel(0) == 0\ntest()"
  - code: "🧩 纯函数"
    zh: "只吃参数、只吐 return，不碰海龟、不 print、不 input——最好测试。把游戏规则写成纯函数"
    en: "Takes parameters, gives back a return; no turtles, print or input — the easiest to test. Put game rules in pure functions"
    example: "def is_safe_landing(speed, drift):\n    return speed <= 2 and drift <= 40"
  - code: "🎯 边界测试"
    zh: "用「刚好在线上」的数字测试，能抓到 < 和 <= 搞混的 bug"
    en: "Test with numbers exactly on the line to catch < vs <= mix-ups"
    example: "assert is_safe_landing(2, 40) == True"
  - code: "abs(x)"
    zh: "去掉负号（绝对值）。算「离中心多远」很好用"
    en: "Drops the minus sign (absolute value). Handy for \"how far from the middle\""
    example: "abs(-30)        # 30\ndrift = abs(x - SHIP_X)"
  - code: "round(x, 1)"
    zh: "四舍五入，保留 1 位小数（显示速度用）"
    en: "Round to 1 decimal place (for showing speed)"
    example: "round(2.468, 1)   # 2.5"
  - code: "# TODO: ..."
    zh: "标记「还没做」的小步骤，做完就删掉"
    en: "Mark a step not done yet; delete it when done"
    example: "# TODO 必做 2：写 go_left() 和 go_right()"
  - code: "# assert ...（睡着的测试）"
    zh: "前面有 # 的测试不会运行。删掉 #（保留空格）就叫醒它：先变红，写好函数再变绿"
    en: "A test with # in front doesn't run. Remove the # (keep the spaces) to wake it: red first, green once the function is written"
    example: "    # assert stage_for(0) == 1\n    assert stage_for(0) == 1"
  - code: "👓 读代码三步"
    zh: "① 从上到下找 def（函数名 = 目录）② 找主循环（while 或 tick）③ 找变量"
    en: "① scan for def (function names = contents) ② find the main loop (while or tick) ③ find the variables"
    example: "def total():  def load():  while True:"
  - code: "🔄 五步循环"
    zh: "计划 → 写 → 测 → 修 → 发布，每圈只做一小步。失败 = 数据（SpaceX 也是这样）"
    en: "Plan → code → test → fix → ship, one small step per lap. Failing = data (SpaceX works this way too)"
    example: "改 10 行 → 运行 → 读报错 → 修好 → commit"
  - code: "📄 任务计划书"
    zh: "名字 / 做什么 / 选的任务 / 必做 3 个 / 加分 2 个 / 小步骤 ≥ 5 / 要测的纯函数"
    en: "Name / what / mission / 3 must-haves / 2 nice-to-haves / ≥5 small steps / pure functions to test"
    example: "小一点，但做完"
  - code: "list.pop(i)"
    zh: "拿掉列表第 i 个（从 0 数）并返回它；越界会 IndexError"
    en: "Remove and return item i (from 0); IndexError if out of range"
    example: "cargo.pop(0)"
