# 📖 小词典：第 2 课学到的指令
icon: "💬"
title: "变量、input()、f-string"
title_en: "Variables, input(), f-strings"
entries:
  - code: "name = \"小海龟\""
    zh: "变量：一个带名字的盒子，把东西放进去（文字要加引号）"
    en: "A variable: a box with a name, put something in it (text needs quotes)"
    example: "size = 100\nname = \"Kiwi\""
  - code: "="
    zh: "「放进盒子」，不是数学的等于。左边是名字，右边是东西"
    en: "\"Put into the box\", not maths equals. Name on the left, thing on the right"
    example: "score = 0"
  - code: "f\"…{name}…\""
    zh: "f-string：句子里的 {盒子} 会换成盒子里的东西"
    en: "f-string: {box} inside the sentence becomes what's in the box"
    example: "print(f\"你好，{name}！\")"
  - code: "input(\"问题？ \")"
    zh: "等你打字，把你打的字交给程序（永远是文字）"
    en: "Waits for you to type and hands the text to the program (always text)"
    example: "animal = input(\"喜欢什么动物？ \")"
  - code: "int(…)"
    zh: "把文字变成整数，这样才能算数"
    en: "Turn text into a whole number so you can do maths"
    example: "age = int(input(\"几岁？ \"))\nprint(age + 1)"
  - code: "+  -  *  /"
    zh: "加 减 乘 除"
    en: "Add, subtract, multiply, divide"
    example: "print(age * 7)"
  - code: "t.write(\"文字\")"
    zh: "海龟在画布上写字；font 可以调大小"
    en: "The turtle writes on the canvas; font sets the size"
    example: "t.write(name, align=\"center\", font=(\"Arial\", 32, \"bold\"))"
  - code: "变量名规则 / naming rules"
    zh: "用英文字母、数字和下划线；不能用空格、不能以数字开头；大小写不一样"
    en: "Letters, numbers and _; no spaces; can't start with a number; Size and size are different"
    example: "my_size = 50   ✅\nmy size = 50   ❌"
