# 📖 小词典：第 12 课学到的东西（部署 + 回顾）
icon: "🏆"
title: "部署上线 + 回顾"
title_en: "Going live + looking back"
entries:
  - code: "部署 deploy"
    zh: "把程序放到网上让别人用。我们的网站 = GitHub 从仓库部署出来的"
    en: "Put a program online for others to use. Our site = GitHub deploying the repo"
    example: "改文件 → Commit → Actions 🟢 → 网站更新"
  - code: "Commit changes"
    zh: "存档 + 一句说明。可以回到任何一版"
    en: "A save point + a note. You can go back to any version"
    example: '"我的项目页上线！"'
  - code: "Actions"
    zh: "仓库上面的标签。GitHub 的机器人在把文件变成网页，转圈 = 还在做，🟢 = 好了"
    en: "A tab on the repo. GitHub's robot turning files into pages; spinning = working, 🟢 = done"
    example: "github.com/…/kiwi-coder/actions"
  - code: "GitHub Pages"
    zh: "GitHub 免费把仓库变成网站的功能"
    en: "GitHub's free way of turning a repo into a website"
    example: "https://cp2phi.github.io/kiwi-coder/my-project/"
  - code: "my-project/index.md"
    zh: "我的项目页。改带 👉 的地方，commit，等 1 分钟"
    en: "My project page. Change the 👉 parts, commit, wait a minute"
    example: 'data-src="…/my-work/week12-showcase.py"'
  - code: "README.md"
    zh: "每个文件夹的「说明书」，打开文件夹第一个看到的就是它"
    en: "A folder's instruction sheet; the first thing you see in a folder"
    example: "my-project/README.md"
  - code: 'pen.write("标题", align="center", font=("Arial", 32, "bold"))'
    zh: "在画布上写字（标题画面）"
    en: "Write text on the canvas (title screen)"
    example: 'pen.goto(0, 60)\npen.write("我的游戏", align="center", font=("Arial", 32, "bold"))'
  - code: 'print("=" * 30)'
    zh: "文字乘以数字 = 重复（画横线做横幅）"
    en: "Text × number = repeat (a line for a banner)"
    example: 'print("-" * 20)'
  - code: "✈️ 起飞前检查"
    zh: "部署前：没红字 · test() ✅ · 第一行有标题作者 · 存到作品墙"
    en: "Before deploying: no red text · test() ✅ · title + author on line 1 · saved to gallery"
    example: "从「↺ 还原」开始跑一次"
  - code: "🛟 四步法"
    zh: "① 读报错 ② 翻笔记本 ③ 问 AI 要提示 ④ 问人"
    en: "① read the error ② check your notebook ③ ask AI for a hint ④ ask a person"
    example: "一辈子都用"
  - code: "📖 12 课速查"
    zh: "L1 print/turtle · L2 变量 input f-string · L3 for range · L4 if random · L5 列表 · L6 while 布尔 · L7 def return · L8 字符串方法 · L9 字典 · L10 assert · L11 排错 onkey ontimer · L12 部署"
    en: "L1 print/turtle · L2 variables input f-string · L3 for range · L4 if random · L5 lists · L6 while booleans · L7 def return · L8 string methods · L9 dict · L10 assert · L11 debugging onkey ontimer · L12 deploy"
    example: "往上翻，每一课都有自己的表"
