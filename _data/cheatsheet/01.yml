# 📖 小词典：第 1 课学到的指令（每课一个文件，网站会自动合并）
icon: "🐢"
title: "打招呼 + 海龟画画"
title_en: "Hello + turtle drawing"
entries:
  - code: 'print("...")'
    zh: "在屏幕上显示文字"
    en: "Show text on the screen"
    example: 'print("Hello!")'
  - code: "import turtle"
    zh: "把海龟工具箱拿出来（写在最上面）"
    en: "Get the turtle toolbox (put it at the top)"
    example: "import turtle"
  - code: "t = turtle.Turtle()"
    zh: "做一只叫 t 的海龟"
    en: "Make a turtle called t"
    example: "t = turtle.Turtle()"
  - code: "t.forward(100)"
    zh: "往前走 100 步（边走边画）"
    en: "Move forward 100 steps (drawing a line)"
    example: "t.forward(150)"
  - code: "t.left(90) / t.right(90)"
    zh: "左转 / 右转 90 度"
    en: "Turn left / right 90 degrees"
    example: "t.left(120)"
  - code: 't.color("red")'
    zh: "笔的颜色（英文名，要加引号）"
    en: "Pen colour (English name in quotes)"
    example: 't.color("hotpink")'
  - code: "t.pensize(5)"
    zh: "笔的粗细"
    en: "Pen thickness"
    example: "t.pensize(8)"
  - code: "t.speed(0)"
    zh: "速度：0 最快，1 最慢，10 很快"
    en: "Speed: 0 fastest, 1 slowest, 10 fast"
    example: "t.speed(0)"
  - code: "t.circle(50)"
    zh: "画一个半径 50 的圆"
    en: "Draw a circle with radius 50"
    example: "t.circle(80)"
  - code: "t.begin_fill() … t.end_fill()"
    zh: "中间画的图形会被涂满"
    en: "Shapes drawn in between get filled in"
    example: 't.fillcolor("yellow")\nt.begin_fill()\n...\nt.end_fill()'
  - code: "t.penup() / t.pendown()"
    zh: "抬笔（走路不画线）/ 落笔"
    en: "Pen up (move without drawing) / pen down"
    example: "t.penup()\nt.goto(0, 100)\nt.pendown()"
  - code: "t.goto(x, y)"
    zh: "走到某个位置（中间是 0, 0）"
    en: "Go to a spot (the middle is 0, 0)"
    example: "t.goto(100, -50)"
  - code: 'turtle.bgcolor("black")'
    zh: "背景颜色"
    en: "Background colour"
    example: 'turtle.bgcolor("navy")'
  - code: "t.hideturtle()"
    zh: "把海龟藏起来（只留画）"
    en: "Hide the turtle (keep the drawing)"
    example: "t.hideturtle()"
  - code: "# 注释"
    zh: "井号后面的话电脑不看，是写给人看的"
    en: "The computer ignores words after #; they're notes for people"
    example: "# 这是屋顶 / this is the roof"
