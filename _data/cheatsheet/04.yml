# 📖 小词典：第 4 课学到的指令
icon: "🎲"
title: "做决定：if / else 和随机数"
title_en: "Decisions: if / else and random numbers"
entries:
  - code: "if 条件:"
    zh: "如果条件是真的，就跑下面缩进的代码（最后要冒号，下面要缩进）"
    en: "If the condition is true, run the indented lines (colon at the end, indent below)"
    example: "if guess == 7:\n    print(\"🎉\")"
  - code: "else:"
    zh: "不然就……（接在 if 后面）"
    en: "Otherwise… (goes after an if)"
    example: "if guess == 7:\n    print(\"对\")\nelse:\n    print(\"错\")"
  - code: "elif 条件:"
    zh: "不然如果……（可以有很多个，从上往下第一个成立的才跑）"
    en: "Otherwise, if… (you can have many; only the first true one runs)"
    example: "if dice == 6:\n    print(\"大吉\")\nelif dice >= 4:\n    print(\"不错\")\nelse:\n    print(\"再来\")"
  - code: "=="
    zh: "「等于吗？」——比较用两个等号！一个 = 是把东西放进盒子"
    en: "\"Is it equal?\" — comparing uses TWO equals signs! One = puts something in a box"
    example: "x = 5        # 放进盒子\nif x == 5:   # 比较"
  - code: "!=  <  >  <=  >="
    zh: "不等于 / 小于 / 大于 / 小于等于 / 大于等于"
    en: "Not equal / less / greater / less or equal / greater or equal"
    example: "if guess > secret:\n    print(\"太大了\")"
  - code: "import random"
    zh: "拿出「随机」工具箱（写在最上面）"
    en: "Get the random toolbox (put it at the top)"
    example: "import random"
  - code: "random.randint(1, 6)"
    zh: "从 1 到 6 随机挑一个整数（两头都包括）"
    en: "Pick a random whole number from 1 to 6 (both ends included)"
    example: "dice = random.randint(1, 6)"
  - code: "break"
    zh: "马上跳出循环，剩下的次数不要了"
    en: "Jump out of the loop right now, skip the remaining times"
    example: "for i in range(5):\n    if guess == secret:\n        break"
  - code: "int(input(\"…\"))"
    zh: "问一个问题，把回答变成数字（第 2 课的 input + int）"
    en: "Ask a question and turn the answer into a number (lesson 2's input + int)"
    example: "guess = int(input(\"你猜: \"))"
  - code: "i % 2 == 0"
    zh: "i 是偶数吗？（余数是 0）"
    en: "Is i even? (remainder 0)"
    example: "if i % 2 == 0:\n    t.color(\"gold\")"
  - code: "abs(a - b)"
    zh: "两个数差多少（永远是正数）"
    en: "How far apart two numbers are (always positive)"
    example: "if abs(guess - secret) <= 2:\n    print(\"🔥 很热\")"
