# 📖 小词典：第 11 课学到的指令
icon: "🛠️"
title: "排错工具箱 + 让程序动起来"
title_en: "Debugging toolbox + making programs move"
entries:
  - code: 'print("到这里了", x)'
    zh: "print 侦探：没报错但答案不对时，让程序把心里的数说出来"
    en: "Print detective: when there's no error but a wrong answer, make the program say what it's thinking"
    example: 'for p in prices:\n    total = total + p\n    print("现在 total 是", total)'
  - code: "读报错 / reading a traceback"
    zh: "① 第几行 → ② 错误种类（NameError…）→ ③ 电脑原话 → ④ 看那一行"
    en: "① line number → ② kind (NameError…) → ③ the message → ④ look at that line"
    example: "IndexError: list index out of range\n→ 位置不存在，第一个是 [0]"
  - code: "# 二分法：注释掉一半"
    zh: "程序太长？注释掉一半再运行，缩小范围"
    en: "Long program? Comment out half and run to narrow it down"
    example: "# t.left(90)\n# t.forward(100)"
  - code: "screen = turtle.Screen()"
    zh: "拿到屏幕，键盘 / 定时器 / 点击都挂在它上面"
    en: "Get the screen; keys, timers and clicks hang on it"
    example: "screen = turtle.Screen()"
  - code: 'screen.onkey(函数, "Left")'
    zh: "按这个键就运行函数（函数名不加括号）"
    en: "Press the key to run the function (name, no brackets)"
    example: 'screen.onkey(go_left, "Left")\nscreen.onkey(jump, "space")'
  - code: "screen.listen()"
    zh: "开始听键盘（忘了这行按键没反应）；运行后先点一下画布"
    en: "Start listening for keys (forget it and nothing happens); click the canvas first"
    example: "screen.listen()"
  - code: "screen.ontimer(函数, 50)"
    zh: "50 毫秒后运行一次函数；在函数里再叫一次 = 游戏心跳"
    en: "Run the function after 50 ms; call it again inside = the game heartbeat"
    example: "def tick():\n    star.sety(star.ycor() - 5)\n    screen.ontimer(tick, 50)\ntick()"
  - code: "screen.onclick(函数)"
    zh: "点画布就运行函数，函数要接 x, y"
    en: "Click the canvas to run the function; it must take x, y"
    example: "def hit(x, y):\n    t.goto(x, y)\nscreen.onclick(hit)"
  - code: "t.distance(另一只)"
    zh: "两只海龟隔多远（判断「碰到了」）"
    en: "How far apart two turtles are (detect a hit)"
    example: "if star.distance(player) < 30:\n    print(\"接到了！\")"
  - code: "t.xcor() / t.ycor()"
    zh: "海龟现在的 x / y 位置"
    en: "The turtle's current x / y"
    example: "if star.ycor() < -250:\n    star.goto(0, 250)"
  - code: "t.setx(x) / t.sety(y)"
    zh: "只改 x 或只改 y"
    en: "Change only x or only y"
    example: "player.setx(player.xcor() + 20)"
  - code: "global score"
    zh: "在函数里改「外面的」变量，先写这一行"
    en: "To change an outside variable inside a function, write this first"
    example: "def add_point():\n    global score\n    score = score + 1"
  - code: "t.penup()  +  t.hideturtle()"
    zh: "做游戏角色：抬笔不画线；不要的海龟藏起来"
    en: "For game sprites: pen up so no lines; hide turtles you don't need"
    example: "player.penup()\npen.hideturtle()"
