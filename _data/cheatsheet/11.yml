# 📖 小词典：第 11 课学到的指令
icon: "🛠️"
title: "排错工具箱 + 让任务动起来"
title_en: "Debugging toolbox + bringing the mission to life"
entries:
  - code: 'print("到这里了", x)'
    zh: "print 侦探：没报错但答案不对、或者游戏卡住时，让程序把心里的数说出来"
    en: "Print detective: when the answer is wrong or the game freezes with no error, make the program say what it's thinking"
    example: "for burn in burns:\n    fuel = fuel - burn\n    print(\"现在 fuel 是\", fuel)"
  - code: "读报错 / reading a traceback"
    zh: "① 第几行 → ② 错误种类（NameError…）→ ③ 电脑原话 → ④ 看那一行 → ⑤ 这个值是从哪来的？"
    en: "① line number → ② kind (NameError…) → ③ the message → ④ look at that line → ⑤ where did this value come from?"
    example: "TypeError: '<=' not supported between 'str' and 'int'\n→ speed 是文字，往回找 input()"
  - code: "🦆 小黄鸭"
    zh: "把代码一行一行念出来（给鸭子、家人或 AI 听），自己就会发现问题"
    en: "Explain the code line by line out loud (to a duck, family or AI) and you'll spot the problem"
    example: "「如果 speed 比 MAX_SPEED 大，就说安全……咦？」"
  - code: "# 二分法：注释掉一半"
    zh: "程序太长？注释掉一半再运行，缩小范围"
    en: "Long program? Comment out half and run to narrow it down"
    example: "# t.right(120)\n# t.forward(60)"
  - code: "screen = turtle.Screen()"
    zh: "拿到屏幕，键盘 / 定时器 / 点击都挂在它上面"
    en: "Get the screen; keys, timers and clicks hang on it"
    example: "screen = turtle.Screen()"
  - code: 'screen.onkey(函数, "Up")'
    zh: "按这个键就运行函数（函数名不加括号）"
    en: "Press the key to run the function (name, no brackets)"
    example: "screen.onkey(engine, \"Up\")\nscreen.onkey(launch, \"space\")"
  - code: "screen.listen()"
    zh: "开始听键盘（忘了这行按键没反应）；运行后先点一下画布"
    en: "Start listening for keys (forget it and nothing happens); click the canvas first"
    example: "screen.listen()"
  - code: "screen.ontimer(函数, 50)"
    zh: "50 毫秒后运行一次函数；在函数里再叫一次 = 游戏心跳；不再叫 = 游戏停"
    en: "Run the function after 50 ms; call it again inside = the game heartbeat; stop calling = the game stops"
    example: "def tick():\n    rock.sety(rock.ycor() - 5)\n    screen.ontimer(tick, 50)\ntick()"
  - code: "vy = vy - GRAVITY"
    zh: "速度变量：重力改速度，速度改位置。点火就是 vy = vy + THRUST"
    en: "A velocity variable: gravity changes velocity, velocity changes position. Thrust is vy = vy + THRUST"
    example: "vy = vy - GRAVITY\nbooster.sety(booster.ycor() + vy)"
  - code: "screen.onclick(函数)"
    zh: "点画布就运行函数，函数要接 x, y"
    en: "Click the canvas to run the function; it must take x, y"
    example: "def star_here(x, y):\n    t.goto(x, y)\nscreen.onclick(star_here)"
  - code: "t.xcor() / t.ycor() / t.setx(x) / t.sety(y)"
    zh: "读 / 改海龟的 x、y 位置"
    en: "Read / change the turtle's x or y"
    example: "ship.setx(keep_inside(ship.xcor() + 30))"
  - code: "global fuel"
    zh: "在函数里改「外面的」变量，先写这一行；改两个就用逗号"
    en: "To change outside variables inside a function, write this first; use a comma for two"
    example: "def engine():\n    global vy, fuel\n    fuel = fuel - 1"
  - code: "t.penup()  +  t.hideturtle()"
    zh: "做游戏角色：抬笔不画线；写字的海龟藏起来"
    en: "For game sprites: pen up so no lines; hide the turtles that only write"
    example: "rock.penup()\nhud.hideturtle()"
