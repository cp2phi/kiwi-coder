# 📖 小词典：第 6 课学到的指令
icon: "🧠"
title: "while 循环 + True / False"
title_en: "while loops + True / False"
entries:
  - code: "while n > 0:"
    zh: "条件还是 True 就一直重复（里面要让它有一天变 False！）"
    en: "Keep repeating while the condition is True (something inside must make it False!)"
    example: "n = 5\nwhile n > 0:\n    print(n)\n    n = n - 1"
  - code: "while True:"
    zh: "永远重复……直到 break 跳出来（break 第 4 课学过）"
    en: "Repeat forever… until break jumps out (break is from lesson 4)"
    example: "while True:\n    x = input(\"? \")\n    if x == \"end\":   # 停车暗号 / stop word\n        break"
  - code: "count += 1"
    zh: "计数器加一（和 count = count + 1 一样）；n -= 1 是减一"
    en: "Add one to a counter (same as count = count + 1); n -= 1 takes one away"
    example: "tries = 0\ntries += 1\nlives -= 1"
  - code: "True / False"
    zh: "每个条件的答案只有这两种"
    en: "Every condition is one of these two"
    example: "print(3 > 2)   # True"
  - code: "a and b"
    zh: "两个都要 True 才是 True"
    en: "True only if both are True"
    example: 'if password == "kiwi" and age >= 10:'
  - code: "a or b"
    zh: "只要一个 True 就是 True"
    en: "True if either one is True"
    example: "if age < 6 or age > 99:"
  - code: "not a"
    zh: "把 True 变 False，False 变 True"
    en: "Flips True and False"
    example: "if not age >= 10:"
  - code: '== / !='
    zh: "等于 / 不等于（文字也能比）"
    en: "Equal / not equal (works for text too)"
    example: 'while again == "yes":\nwhile guess != secret:'
  - code: "t.distance(0, 0)"
    zh: "海龟离某个点多远"
    en: "How far the turtle is from a point"
    example: "while t.distance(0, 0) < 250:\n    t.forward(10)"
  - code: "while a and b:"
    zh: "两个条件都 True 才继续；停下来以后用 if 查是哪个原因"
    en: "Keep going only while both are True; after it stops, use if to see why"
    example: "while guess != secret and tries < 6:\n    ...\nif guess == secret:\n    print(\"🎉\")"
  - code: "launched = False"
    zh: "旗子变量：先放下旗子，条件满足时变 True，while not 就停了"
    en: "A flag variable: start False, set True when done, and while not stops"
    example: "launched = False\nwhile not launched:\n    ...\n    launched = True"
  - code: "rain = x == 1"
    zh: "比较的结果（True / False）也能放进盒子"
    en: "A comparison's result (True / False) can go in a box too"
    example: "rain = random.randint(1, 4) == 1\nif not rain:\n    print(\"☀️\")"
