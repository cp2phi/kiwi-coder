# 📖 小词典：第 6 课学到的指令
icon: "🧠"
title: "while 循环 + True / False"
title_en: "while loops + True / False"
entries:
  - code: "while n > 0:"
    zh: "条件还是 True 就一直重复（里面要让它有一天变 False！）"
    en: "Keep repeating while the condition is True (something inside must make it False!)"
    example: "n = 5\nwhile n > 0:\n    print(n)\n    n = n - 1"
  - code: "while True:"
    zh: "永远重复……"
    en: "Repeat forever…"
    example: "while True:\n    x = input(\"? \")\n    if x == \"quit\":\n        break"
  - code: "break"
    zh: "……跳出循环"
    en: "…jump out of the loop"
    example: "if count == 10:\n    break"
  - code: "count += 1"
    zh: "计数器加一（和 count = count + 1 一样）"
    en: "Add one to a counter (same as count = count + 1)"
    example: "tries = 0\ntries += 1"
  - code: "n -= 1"
    zh: "减一"
    en: "Take one away"
    example: "n -= 1"
  - code: "True / False"
    zh: "每个条件的答案只有这两种"
    en: "Every condition is one of these two"
    example: "print(3 > 2)   # True"
  - code: "a and b"
    zh: "两个都要 True 才是 True"
    en: "True only if both are True"
    example: 'if password == "kiwi" and age >= 10:'
  - code: "a or b"
    zh: "只要一个 True 就是 True"
    en: "True if either one is True"
    example: "if age < 6 or age > 99:"
  - code: "not a"
    zh: "把 True 变 False，False 变 True"
    en: "Flips True and False"
    example: "if not age >= 10:"
  - code: '== / !='
    zh: "等于 / 不等于（文字也能比）"
    en: "Equal / not equal (works for text too)"
    example: 'while again == "yes":\nwhile guess != secret:'
  - code: "t.distance(0, 0)"
    zh: "海龟离某个点多远"
    en: "How far the turtle is from a point"
    example: "while t.distance(0, 0) < 250:\n    t.forward(10)"
