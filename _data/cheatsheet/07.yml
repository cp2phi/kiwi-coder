# 📖 小词典：第 7 课学到的指令
icon: "📦"
title: "把代码打包：函数"
title_en: "Packing code: functions"
entries:
  - code: "def square():"
    zh: "教一个叫 square 的招式（定义函数）。只是教，不运行"
    en: "Teach a trick called square (define a function). Teaching only, nothing runs"
    example: "def square():\n    for i in range(4):\n        t.forward(80)\n        t.left(90)"
  - code: "square()"
    zh: "喊名字 = 表演一次（调用函数）"
    en: "Call the name = perform once (call the function)"
    example: "square()\nsquare()"
  - code: "def house(x, y, size):"
    zh: "括号里是参数：喊的时候按顺序递东西进去"
    en: "Parameters in the brackets: handed in, in order, when you call"
    example: "def house(x, y, size):\n    ...\nhouse(-100, 0, 80)"
  - code: "return 结果"
    zh: "把结果交回去。交回来的可以存进变量、print、放进 if"
    en: "Hand a result back. Store it, print it or use it in an if"
    example: "def double(n):\n    return n * 2\nx = double(5)   # 10"
  - code: "def greet(name=\"Kiwi\"):"
    zh: "默认值：不递东西就用它（进阶，课上没讲）"
    en: "Default value: used if nothing is handed in (advanced, not covered in class)"
    example: 'def greet(name="Kiwi"):\n    return f"Kia ora, {name}!"\nprint(greet())'
  - code: "def street(n):\n    for i in range(n):\n        house(i * 120, 0, 80)"
    zh: "招式里可以喊别的招式"
    en: "Tricks can call other tricks"
    example: "street(5)"
  - code: "# 函数里的变量只在里面"
    zh: "参数和函数里新建的变量，外面看不到"
    en: "Parameters and variables made inside a function can't be seen outside"
    example: "def f(n):\n    n = n * 10   # 只改里面的 n / only the inside n"
  - code: "# 招式上面写一行注释"
    zh: "每个函数上面写一句它是干嘛的，一个月后的你会感谢现在的你"
    en: "Write one line above each function saying what it does; future you will say thanks"
    example: "# 在 (x, y) 画一棵树 / draw a tree at (x, y)\ndef tree(x, y):"
