# 📖 小词典：第 7 课学到的指令
icon: "📦"
title: "把代码打包：函数"
title_en: "Packing code: functions"
entries:
  - code: "def square():"
    zh: "教一个叫 square 的招式（定义函数）。只是教，不运行"
    en: "Teach a trick called square (define a function). Teaching only, nothing runs"
    example: "def square():\n    for i in range(4):\n        t.forward(80)\n        t.left(90)"
  - code: "square()"
    zh: "喊名字 = 表演一次（调用函数）"
    en: "Call the name = perform once (call the function)"
    example: "square()\nsquare()"
  - code: "def house(x, y, size):"
    zh: "括号里是参数：喊的时候按顺序递东西进去"
    en: "Parameters in the brackets: handed in, in order, when you call"
    example: "def house(x, y, size):\n    ...\nhouse(-100, 0, 80)"
  - code: "return 结果"
    zh: "把结果交回去，招式马上结束。交回来的可以存进变量、print、放进 if"
    en: "Hand a result back; the trick ends right there. Store it, print it or use it in an if"
    example: "def double(n):\n    return n * 2\nx = double(5)   # 10"
  - code: "double(double(5))"
    zh: "一个招式的结果递给另一个招式：先算里面，再算外面"
    en: "One trick's result handed to another: inside first, then outside"
    example: "print(double(double(5)))   # 20"
  - code: "return n % 2 == 0"
    zh: "交回 True / False 的「问题招式」，可以直接放进 if"
    en: "A \"question trick\" that returns True / False, used straight in an if"
    example: "def is_even(n):\n    return n % 2 == 0\nif is_even(4):\n    print(\"双数 / even\")"
  - code: "def countdown(start=10):"
    zh: "默认值：喊的时候不递这个参数，就用 = 后面的值。有默认值的参数要排在最后"
    en: "Default value: used when you don't hand that parameter in. Defaults go last"
    example: "countdown()     # start = 10\ncountdown(3)    # start = 3"
  - code: "return numbers"
    zh: "交回一整个列表，外面用 for 一个一个拿"
    en: "Hand back a whole list; take the items one by one with a for outside"
    example: "for n in countdown(5):\n    print(n)"
  - code: "def street(n, y):\n    for i in range(n):\n        house(i * 120, y, 80)"
    zh: "招式里可以喊别的招式"
    en: "Tricks can call other tricks"
    example: "street(5, -150)"
  - code: "# 函数里的变量只在里面"
    zh: "参数和函数里新建的变量是函数自己的：名字一样也是另一个盒子，外面看不到也改不到"
    en: "Parameters and variables made inside belong to the function: same name, different box; the outside can't see or change them"
    example: "def boost(fuel):\n    fuel = fuel * 2   # 只改里面的 / inside only\n    return fuel + 1"
  - code: "colours[i % len(colours)]"
    zh: "轮流用列表里的东西，永远不会超出列表"
    en: "Use list items in turn, never running off the end"
    example: "for i in range(10):\n    t.color(colours[i % len(colours)])"
  - code: "# 招式上面写一行注释"
    zh: "每个函数上面写一句它是干嘛的，一个月后的你会感谢现在的你"
    en: "Write one line above each function saying what it does; future you will say thanks"
    example: "# 在 (x, y) 画一棵树 / draw a tree at (x, y)\ndef tree(x, y):"
